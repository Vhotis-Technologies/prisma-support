<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Prisma Support{% endblock %}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        line-height: 1.5;
        color: #1f2937;
        background-color: #f3f4f6;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .email-wrapper {
        width: 100%;
        max-width: 100%;
        min-width: 100%;
        padding: 0;
        margin: 0;
      }

      .email-container {
        width: 100%;
        max-width: 100%;
        min-width: 100%;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
        padding: 24px 20px;
        text-align: center;
        position: relative;
      }

      .header-accent {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
      }

      .header-title {
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.5px;
      }

      .header-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        color: #fef3c7;
        background: rgba(245, 158, 11, 0.35);
        padding: 4px 10px;
        border-radius: 20px;
        margin-top: 8px;
        letter-spacing: 0.5px;
      }

      .content {
        padding: 24px 20px;
        background-color: #ffffff;
      }

      .greeting {
        font-size: 17px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 12px;
      }

      .intro-text {
        font-size: 14px;
        color: #4b5563;
        margin-bottom: 20px;
        line-height: 1.6;
      }

      .email-footer {
        padding: 20px 20px 24px;
        text-align: center;
        background-color: #f8fafc;
        border-top: 1px solid #e2e8f0;
      }

      .footer-links {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 10px;
      }

      .footer-links a {
        color: #2563eb;
        text-decoration: none;
      }

      .footer-links a:hover {
        text-decoration: underline;
      }

      .footer-links span {
        margin: 0 6px;
        color: #cbd5e1;
      }

      .footer-copy {
        font-size: 11px;
        color: #94a3b8;
      }

      .btn-primary {
        display: inline-block;
        background: #2563eb;
        color: #ffffff !important;
        padding: 14px 28px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        margin: 12px 0;
      }

      .btn-primary:hover {
        background: #1d4ed8;
      }

      .contact-box {
        background-color: #f8fafc;
        border-left: 4px solid #2563eb;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 20px;
      }

      .contact-title {
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 6px;
      }

      .contact-text {
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
      }

      .contact-link {
        color: #2563eb;
        text-decoration: none;
      }

      .closing {
        margin-top: 20px;
        padding-top: 12px;
        border-top: 1px solid #e2e8f0;
      }

      .signature {
        font-size: 14px;
        color: #64748b;
      }

      .signature-name {
        font-weight: 600;
        color: #1e293b;
      }

      .reminders-box {
        background-color: #fffbeb;
        border-left: 4px solid #f59e0b;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 20px;
      }

      .reminders-box .contact-text {
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="email-wrapper">
      <div class="email-container">
        <div class="content">{% block content %}{% endblock %}</div>

        <div class="email-footer">
          {% block footer %}
          <div class="footer-links">
            <a href="{{ privacy_policy_url|default:'https://prismavalet.com/privacy' }}">Privacy Policy</a><span>|</span><a href="{{ terms_of_service_url|default:'https://prismavalet.com/terms' }}">Terms of Service</a>
          </div>
          <div class="footer-copy">&copy; {{ current_year|default:"2026" }} Prisma Car Care. All rights reserved.</div>
          {% endblock %}
        </div>
      </div>
    </div>
  </body>
</html>
